---
openapi: 3.0.3
info:
  title: Basic integration test
  version: 23.5.2
servers:
  - url: ""
tags:
  - name: UserController
    description: |-
      User related **apis**

      Can do:
      - update a user
      - get all users
      - get all records
      - redirect to something

      Enjoy! 😉
paths:
  /api/user/issue262:
    get:
      tags:
        - UserController
      operationId: redirectUsingRedirectView
      description: Redirect somewhere
      responses:
        200:
          description: the return object should not be documented
  /api/user/records:
    get:
      tags:
        - UserController
      operationId: getRecords
      description: List all the records. This comment is still in the old javadoc
        formalism.
      responses:
        200:
          description: all the available records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordDto'
  /api/user/update:
    put:
      tags:
        - UserController
      operationId: updateUser
      description: Update the **user**
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
        description: The user to update
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
  /api/user/user-dtos:
    get:
      tags:
        - UserController
      operationId: getUserDtos
      description: Get all **users**
      responses:
        200:
          description: a list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
components:
  schemas:
    Authority:
      description: |
        All the possible authorities
          * `ACCESS_APP` - Access to the app
          * `READ_USER` - Allowed to read user **informations**
          * `UPDATE_USER` - Allowed to update the user.

        Please use carefully
      type: string
      enum:
        - ACCESS_APP
        - READ_USER
        - UPDATE_USER
      x-enum-descriptions:
        - Access to the app
        - Allowed to read user **informations**
        - |-
          Allowed to update the user.

          Please use carefully
    RecordDto:
      description: Dto used for a good reason.
      type: object
      properties:
        counter:
          description: a counter
          type: integer
          format: int32
        listSubRecords:
          description: a list of plenty of sub records
          type: array
          items:
            $ref: '#/components/schemas/SubRecordDto'
    SubRecordDto:
      description: This is a record in a record
      type: object
      properties:
        nbSomething:
          description: number of something
          type: integer
          format: int32
        code:
          description: the **code**
          type: string
    UserDto:
      description: "A Dto representing a user, with his authorities."
      required:
        - login
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
          minLength: 1
          maxLength: 50
        firstName:
          type: string
          minLength: 0
          maxLength: 50
        lastName:
          type: string
          minLength: 0
          maxLength: 50
        email:
          type: string
          minLength: 5
          maxLength: 254
        imageUrl:
          type: string
          minLength: 0
          maxLength: 256
        activated:
          type: boolean
        langKey:
          type: string
          minLength: 2
          maxLength: 10
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
        authorities:
          type: array
          items:
            $ref: '#/components/schemas/Authority'
          uniqueItems: true
